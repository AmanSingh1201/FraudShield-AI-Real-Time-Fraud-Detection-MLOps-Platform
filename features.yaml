pca_features:
  columns: [V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14, V15, V16,
            V17, V18, V19, V20, V21, V22, V23, V24, V25, V26, V27, V28]
  transform: passthrough        # already PCA-transformed upstream by data provider

amount_features:
  - name: amount_log1p
    definition: "log1p(Amount)"
    source: Amount
    availability: at transaction time
    leakage_risk: none
    dtype: float
  - name: amount_zscore
    definition: "(Amount - train_mean) / train_std, scaler fit on train only"
    source: Amount
    availability: at transaction time
    leakage_risk: none (scaler fit on train split only)
    dtype: float

time_features:
  - name: hour_of_day
    definition: "floor((Time mod 86400) / 3600)"
    source: Time
    availability: at transaction time
    leakage_risk: none
    dtype: int
  - name: time_since_start_norm
    definition: "Time / max(Time in train)"
    source: Time
    availability: at transaction time (relative position, not used at inference for new data — see note)
    leakage_risk: "LOW: only meaningful within this fixed 2-day window; excluded from the deployed inference feature set, kept for offline EDA only"
    dtype: float
    used_in_model: false

excluded_features:
  - name: Time (raw)
    reason: >
      Raw elapsed-seconds-since-dataset-start has no meaning for a new transaction
      arriving after deployment; only its derived cyclical feature (hour_of_day) is
      used in the production feature set.
