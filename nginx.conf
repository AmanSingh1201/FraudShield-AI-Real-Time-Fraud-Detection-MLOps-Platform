worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=fraudshield_rl:10m rate=300r/m;

    server {
        listen 80;

        client_max_body_size 1m;

        location /health {
            proxy_pass http://fraudshield_api:8000/health;
        }

        location / {
            limit_req zone=fraudshield_rl burst=20 nodelay;
            proxy_pass http://fraudshield_api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 5s;
        }
    }
}
